<section class="panel"><h2>通知選択</h2>
<form id="bot-form">
<label><input id="bot-now" type="checkbox"> 次の対戦へ進んだとき、NOWの3名をまとめて呼び出す</label>
<label><input id="bot-reply" type="checkbox"> @JoinQueueBotへの呼びかけに本人の待機順・グループを返信する</label>
<label><input id="bot-periodic" type="checkbox"> 待機人数・待機グループ数を定期案内する</label>
<label>案内間隔<select id="bot-interval"><option value="15">15分</option><option value="30">30分</option></select></label>

<button type="submit">Bot設定を保存</button><p id="bot-save-result" role="status"></p></form></section>
<section class="panel"><h2>チャンネル接続と起動</h2>
<p>① <a href="https://www.youtube.com/@JoinQueueBot" target="_blank" rel="noopener noreferrer">@JoinQueueBot</a> をモデレーターに登録<br>② 自分の配信チャンネルを接続<br>③ 管理画面のライブ連携で配信を選択し、Botを起動</p>

<p id="bot-status" role="status">確認中…</p><p id="bot-last"></p><p id="bot-next"></p>
<button id="bot-connect" type="button">チャンネルを接続</button>
<button id="bot-status-check" type="button">認証結果を確認</button>
<p><a id="bot-login-link" hidden target="_blank" rel="noopener noreferrer">ブラウザーでチャンネルを認証する</a> <span id="bot-confirmation"></span></p>
<button id="bot-check" type="button">接続確認（投稿なし）</button>
<button id="bot-start" type="button">Botを起動</button>
<button id="bot-stop" type="button">Botを停止</button><p id="bot-login-result" role="status"></p>
<p>再起動時は停止状態です。停止・設定変更時に未送信通知を破棄します。送信済み・送信中の投稿は取り消せません。配信変更や接続切断時も停止します。実配信での接続・投稿確認は未完了です。</p>
<details><summary>チャンネル接続を解除</summary><p>待機列・履歴は保持します。サーバーで接続を失効できない場合はキーを残し、通信復旧後にやり直します。</p>
<label><input id="bot-disconnect-confirm" type="checkbox"> 接続を解除することを確認しました</label>
<button id="bot-disconnect" type="button" disabled>接続を解除</button></details>
</section>
