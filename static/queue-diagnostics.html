<dialog id="session-reset-dialog" aria-labelledby="session-reset-title">
    <h2 id="session-reset-title">今回の参加回数を0から数え直しますか？</h2>
    <p>現在の待機列・累計回数・過去の履歴・申告名・設定は残します。優先判定とOBSの「○回目」は今回0回から数え直します。現在の並び順は変更しません。</p>
    <button id="session-reset-cancel" type="button" autofocus>戻る</button>
    <button id="session-reset-confirm" type="button">確認して今回の回数をリセット</button>
</dialog>
