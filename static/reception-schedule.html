<section class="reception-deadline" aria-labelledby="deadline-heading">
    <div class="reception-deadline-row">
        <label id="deadline-heading" for="reception-time">受付終了時刻を予約</label>
        <input id="reception-time" type="text" inputmode="numeric" placeholder="23:30" maxlength="5" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" aria-label="受付終了時刻（24時間形式）" aria-describedby="reception-result" autocomplete="off" disabled>
    </div>
    <p id="reception-result" role="status"></p>
</section>
