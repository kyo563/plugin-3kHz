<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Settings</title>
    <link rel="stylesheet" href="/static/settings.css">
</head>
<body>
    <main>
        <h1>設定画面（モック）</h1>

        <div class="item">
            <label>参加希望ワード</label>
            <input value="参加希望, 参加します">
        </div>

        <div class="item">
            <label>取消ワード</label>
            <input value="取消, キャンセル">
        </div>

        <div class="item">
            <label>判定方式</label>
            <select>
                <option>完全一致 + 前方一致</option>
            </select>
        </div>

        <div class="item">
            <label>グループ人数</label>
            <input value="視聴者3人固定" readonly>
        </div>

        <div class="item">
            <label>不足枠表示</label>
            <input value="参加者募集中" readonly>
        </div>

        <div class="item">
            <label>OBS表示ラベル</label>
            <input value="NOW / NEXT / QUEUE" readonly>
        </div>

        <div class="item">
            <label>表示テーマ</label>
            <input value="MVP固定" readonly>
        </div>

        <div class="item">
            <label>参加回数表示</label>
            <input value="管理画面のみ" readonly>
        </div>

        <div class="item">
            <label>チャット取得</label>
            <input value="外部チャット取得アプリ想定（未接続）" readonly>
        </div>
    </main>

    <script src="/static/settings.js"></script>
</body>
</html>
