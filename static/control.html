<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Control</title>
    <link rel="stylesheet" href="/static/control.css">
</head>
<body>
    <div class="wrap">
        <h1>待機列整理アプリ / 管理画面</h1>

        <div class="status">
            <span id="conn">接続状態: Mock Provider connected</span>
            <span id="open"></span>
            <span id="priority"></span>
            <span>40秒状態変更ロック: 有効</span>
        </div>

        <div class="actions">
            <button data-api="/api/mock/toggle-open">受付開始 / 受付終了</button>
            <button data-api="/api/mock/toggle-priority">低消化回数優先モード ON/OFF</button>
            <button data-api="/api/mock/move-next">次の対戦に移る（参加回数+1）</button>
            <button data-api="/api/mock/add">テスト参加者を追加</button>
            <button data-api="/api/mock/cancel">テスト取消</button>
            <button data-api="/api/mock/reset">リセット</button>
        </div>

        <div class="grid">
            <section>
                <h2>NOW</h2>
                <ul id="now"></ul>
            </section>
            <section>
                <h2>NEXT（ドラッグで並び替え可）</h2>
                <ul id="next"></ul>
            </section>
            <section>
                <h2>QUEUE（ドラッグで並び替え可）</h2>
                <ul id="queue"></ul>
            </section>
        </div>

        <section>
            <h2>操作ログ</h2>
            <ul id="logs"></ul>
        </section>
    </div>

    <ul id="context-menu" style="display:none;position:absolute;z-index:1000;background:#fff;border:1px solid #ccc;list-style:none;padding:4px;margin:0;">
        <li><button type="button" data-action="move-tail">待機列の最後尾へ移動</button></li>
        <li><button type="button" data-action="remove">削除</button></li>
        <li><button type="button" data-action="edit-name">申告名を編集</button></li>
        <li><button type="button" data-action="clear-name">申告名を削除</button></li>
    </ul>

    <script src="/static/control.js"></script>
</body>
</html>
