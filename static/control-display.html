<fieldset id="control-display-options" aria-describedby="control-display-status">
    <legend>表示項目（NOW・待機列）</legend>
    <label><input type="checkbox" data-display="avatar" checked disabled> アイコン</label>
    <label><input type="checkbox" data-display="username" checked disabled> ユーザー名（@）</label>
    <label><input type="checkbox" data-display="alias" checked disabled> 申告名／ニックネーム</label>
    <label><input type="checkbox" data-display="memo" checked disabled> わんコメのメモ</label>
    <label><input type="checkbox" data-display="count" checked disabled> 参加回数</label>
    <label><input type="checkbox" data-display="order" checked disabled> 待機順</label>
</fieldset>
<p id="control-display-status" role="status">表示項目を読み込み中…</p>
<button id="control-display-retry" type="button" hidden>表示設定を再読み込み</button>
