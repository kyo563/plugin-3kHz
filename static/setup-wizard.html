<section id="setup-wizard" class="panel" hidden aria-labelledby="setup-title">
<h2 id="setup-title" tabindex="-1">初回セットアップ</h2><p id="setup-progress" role="status"></p>
<p id="setup-instruction"></p>
<label id="setup-bot-choice" hidden><input id="setup-use-bot" type="checkbox"> 共通Botを使用する</label>
<label id="setup-obs-choice" hidden><input id="setup-use-obs" type="checkbox"> OBS表示を使用する</label>
<p id="setup-summary" hidden></p>
<button id="setup-back" type="button">戻る</button><button id="setup-next" type="button">次へ</button>
<button id="setup-skip" type="button">スキップ（あとで設定）</button>
<button id="setup-later" type="button">あとで設定する</button><p id="setup-result" role="status"></p>
</section>
